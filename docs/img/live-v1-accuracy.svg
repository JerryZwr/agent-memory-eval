<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 236" width="776" height="236" role="img" aria-labelledby="title desc">
<title id="title">答案正确率与 95% Wilson 区间，按证据窗口类别和评分员口径</title>
<desc id="desc">A null v1: 30/110 = 27% [20%, 36%]; A null v2: 52/110 = 47% [38%, 57%]; A bm25 v1: 59/110 = 54% [44%, 63%]; A bm25 v2: 67/110 = 61% [52%, 70%]; A mem0 v1: 66/110 = 60% [51%, 69%]; A mem0 v2: 75/110 = 68% [59%, 76%]; D null v1: 47/78 = 60% [49%, 70%]; D null v2: 78/78 = 100% [95%, 100%]; D bm25 v1: 62/78 = 79% [69%, 87%]; D bm25 v2: 78/78 = 100% [95%, 100%]; D mem0 v1: 65/78 = 83% [74%, 90%]; D mem0 v2: 77/78 = 99% [93%, 100%]</desc>
<style>
.bg { fill: #fcfcfb; }
.t { font: 12px system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #52514e; }
.t.strong { fill: #0b0b0b; font-weight: 600; }
.grid { stroke: #e4e3df; stroke-width: 1; }
.axis { stroke: #b9b8b2; stroke-width: 1; }
.s0 { fill: #2a78d6; stroke: #2a78d6; }
.s1 { fill: #eb6834; stroke: #eb6834; }
.w { fill: none; stroke-width: 2; }
.ring { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  .t { fill: #c3c2b7; }
  .t.strong { fill: #f0efec; }
  .grid { stroke: #33332f; }
  .axis { stroke: #5c5b55; }
  .s0 { fill: #3987e5; stroke: #3987e5; }
  .s1 { fill: #d95926; stroke: #d95926; }
  .ring { stroke: #1a1a19; }
}
</style>
