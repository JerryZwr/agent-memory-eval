[project]
name = "agentmemeval"
version = "0.1.0"
description = "Evaluation framework for AI memory systems and tool-calling agents, with calibrated judges and failure attribution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Black-XZ", email = "Black-XZ@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Real LLM / memory-service calls. Only used behind the `live` marker / `--live`.
live = [
    "openai>=1.0",
    "mem0ai>=0.1",
    "ollama>=0.4",
]
# Fetching the public EverMemBench dataset (scripts/download_data.py).
data = [
    "huggingface-hub>=0.24",
]

[project.scripts]
agentmemeval = "agentmemeval.cli:main"

# The pytest plugin ships as its own top-level package and loads automatically.
[project.entry-points.pytest11]
agenteval = "pytest_agenteval.plugin"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "allure-pytest>=2.13",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["agentmemeval", "pytest_agenteval"]

[tool.pytest.ini_options]
minversion = "8.0"
# tests/eval holds measurements (cases fail when the system under test answers wrong);
# they run explicitly (`uv run pytest tests/eval`), not as part of the default gate.
testpaths = ["tests/unit", "tests/plugin", "tests/agent"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-p", "pytester"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure functions and components, offline",
    "agent: agent-layer evaluation cases driven by ScriptedLLM, offline",
    "live: real LLM / memory-service calls; skipped unless --live is given (needs .env, costs money)",
    "slow: takes more than a few seconds",
    "eval: per-question measurement of the system under test (tests/eval)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode chars: Chinese full-width punctuation is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
line-ending = "lf"
